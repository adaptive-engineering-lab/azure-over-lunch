name: data-layer

on:
  pull_request:
    paths:
      # T045: spec-only PRs are excluded — paths-ignore wins over paths
      # only when no listed path matches, so we list what *should* trigger.
      - supabase/**
      - tools/**
      - tests/**
      - .github/workflows/data-layer.yml
  push:
    branches: [main]
    paths:
      - supabase/**
      - tools/**
      - tests/**
      - .github/workflows/data-layer.yml

jobs:
  schema-and-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: pnpm install
        working-directory: tools
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations
        # supabase start already applies migrations under supabase/migrations/;
        # this is a defensive re-apply in case the CLI version's auto-apply
        # behavior changes.
        run: supabase db reset --linked=false

      - name: Export local Supabase keys
        run: |
          status=$(supabase status --output json)
          echo "SUPABASE_URL=$(echo "$status" | jq -r .API_URL)" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(echo "$status" | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$status" | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"

      - name: Validate seed content
        working-directory: tools
        run: pnpm seed:validate

      - name: Seed
        working-directory: tools
        run: pnpm seed

      - name: Tests
        working-directory: tools
        run: pnpm test

      - name: Stop Supabase stack
        if: always()
        run: supabase stop --no-backup
